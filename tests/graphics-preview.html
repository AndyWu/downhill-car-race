<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graphics Preview</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font:12px/1.2 system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh}
  .lbl{position:absolute;transform:translate(-50%,0);color:#fff;text-shadow:0 0 3px #000,0 0 6px #000;font-weight:600;pointer-events:none;white-space:nowrap}
  #info{position:absolute;left:8px;top:6px;color:#fff;text-shadow:0 0 4px #000;font-weight:600}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { createRenderer, createMaterials, setupLighting, attachHeadlight, createPostFX, getTier } from '/src/graphics/index.js';

const q = new URLSearchParams(location.search);
const shot = q.get('shot') || 'materialsA';
const time = q.get('time') || 'day';
const W = +(q.get('w') || innerWidth), H = +(q.get('h') || innerHeight);

const canvas = document.getElementById('c');
const renderer = createRenderer(canvas, { preserveDrawingBuffer: true, dynamicResolution: q.get('dyn') === '1' });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, W / H, 0.2, 2500);
const t0 = performance.now();
const mats = createMaterials(renderer);
const matMs = performance.now() - t0;
const light = setupLighting(scene, renderer);
light.setTime(time, true);
const post = createPostFX(renderer, scene, camera, { msaa: +(q.get('msaa') ?? 4) });
post.setSize(W, H);
window.__gfx = { renderer, scene, camera, mats, light, post };

const labels = [];
function label(text, pos) {
  const el = document.createElement('div'); el.className = 'lbl'; el.textContent = text; document.body.appendChild(el);
  labels.push({ el, pos: pos.clone() });
}
const scaleUV = (geo, su, sv) => { const a = geo.attributes.uv; for (let i = 0; i < a.count; i++) a.setXY(i, a.getX(i) * su, a.getY(i) * sv); return geo; };

// ---------------- common ground ----------------
const groundMat = mats.worldUV('dirtRoad', { scale: 5, mode: 'planar' });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000, 150, 150).rotateX(-Math.PI / 2), groundMat);
ground.receiveShadow = true; ground.position.y = 0; scene.add(ground);
const grassGround = mats.worldUV('grass', { scale: 2.5, mode: 'planar' });
function addGrassStrip(x, z, w, d) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2), grassGround);
  m.position.set(x, 0.005, z); m.receiveShadow = true; scene.add(m); return m;
}
const put = (mesh, x, y, z, shadow = true) => { mesh.position.set(x, y, z); mesh.castShadow = shadow; mesh.receiveShadow = true; scene.add(mesh); return mesh; };

// ---------------- station: material swatches ----------------
function swatchRow(names, x0, z0, defs) {
  const sp = 2.1;
  names.forEach((n, i) => {
    const x = x0 + (i - (names.length - 1) / 2) * sp;
    const m = defs[n] ?? mats[n];
    const sph = put(new THREE.Mesh(scaleUV(new THREE.SphereGeometry(0.85, 48, 32), 2, 1), m), x, 0.85, z0);
    const patchGeo = scaleUV(new THREE.BoxGeometry(1.9, 0.12, 1.9), 1.5, 1.5);
    put(new THREE.Mesh(patchGeo, m), x, 0.06, z0 + 2.5, false);
    label(n, new THREE.Vector3(x, 2.0, z0));
  });
}
const defsA = {};
swatchRow(['dirtRoad', 'mud', 'rock', 'sand', 'grass', 'woodWeathered', 'barnPaint'], 0, 0, defsA);
const dummy = { };
// station B
const foliageCardGeo = new THREE.PlaneGeometry(1.8, 1.8).translate(0, 0.9, 0);
{
  const names = ['metalRusted', 'rope', 'hay', 'rubber', 'paintChipped', 'foliage', 'glass'];
  const x0 = 60, z0 = 0, sp = 2.1;
  names.forEach((n, i) => {
    const x = x0 + (i - 3) * sp;
    if (n === 'foliage') {
      for (const a of [0, 1.0, 2.1]) { const c = put(new THREE.Mesh(foliageCardGeo, mats.foliage), x, 0, z0, true); c.rotation.y = a; c.customDepthMaterial = mats.foliage.userData.depthMaterial; }
      const c2 = put(new THREE.Mesh(foliageCardGeo, mats.foliage), x, 0, z0 + 2.5, true); c2.rotation.y = 0.4; c2.customDepthMaterial = mats.foliage.userData.depthMaterial;
    } else if (n === 'glass') {
      put(new THREE.Mesh(new THREE.SphereGeometry(0.85, 48, 32), mats[n]), x, 0.85, z0, false);
      put(new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.4, 0.05), mats[n]), x, 0.8, z0 + 2.5, false);
      put(new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.1, 2.0), mats.woodWeathered), x, 0.05, z0 + 2.5, false);
    } else {
      const m = mats[n];
      put(new THREE.Mesh(scaleUV(new THREE.SphereGeometry(0.85, 48, 32), n === 'rope' ? 3 : 2, n === 'rope' ? 6 : 1), m), x, 0.85, z0);
      put(new THREE.Mesh(scaleUV(new THREE.BoxGeometry(1.9, 0.12, 1.9), 1.5, 1.5), m), x, 0.06, z0 + 2.5, false);
    }
    label(n, new THREE.Vector3(x, 2.0, z0));
  });
}

// ---------------- station: puddle ----------------
{
  const cx = 120, cz = 0;
  const mudPatch = new THREE.Mesh(scaleUV(new THREE.PlaneGeometry(9, 6).rotateX(-Math.PI / 2), 3, 2), mats.asDecal(mats.worldUV('mud', { scale: 2.5 })));
  mudPatch.position.set(cx, 0.02, cz); mudPatch.receiveShadow = true; scene.add(mudPatch);
  const water = new THREE.Mesh(mats.makePuddleGeometry(3.2, 2.0, 3), mats.waterPuddle); water.position.set(cx, 0.03, cz); water.renderOrder = 2; scene.add(water);
  // things to be reflected + context
  for (const [dx, dz, s] of [[-3.5, -2.8, 1.1], [3.8, -2.2, 0.8], [4.4, 2.0, 1.3]]) put(new THREE.Mesh(new THREE.DodecahedronGeometry(s, 1), mats.rock), cx + dx, s * 0.5, cz + dz);
  put(new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 2.6, 12), mats.woodWeathered), cx - 2.3, 1.3, cz - 3.2);
  put(new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 2.2, 12), mats.woodWeathered), cx + 0.5, 1.1, cz - 3.4);
  const rope = new THREE.Mesh(scaleUV(new THREE.CylinderGeometry(0.035, 0.035, 2.9, 8), 1, 8).rotateZ(Math.PI / 2), mats.rope); put(rope, cx - 0.9, 2.0, cz - 3.3);
  const barn = new THREE.Mesh(scaleUV(new THREE.BoxGeometry(14, 6, 0.4), 7, 3), mats.barnPaint); put(barn, cx, 3, cz - 8);
  addGrassStrip(cx - 9, cz + 1, 6, 10);
}

// ---------------- station: barn wall ----------------
{
  const cx = 180, cz = 0;
  const wall = new THREE.Mesh(new THREE.BoxGeometry(12, 6, 0.4), mats.worldUV('barnPaint', { scale: 2.5, mode: 'triplanar', macroScale: 1 / 9 })); put(wall, cx, 3, cz - 4);
  const door = new THREE.Mesh(scaleUV(new THREE.BoxGeometry(3.2, 3.8, 0.2), 3, 3.8), mats.woodWeathered); put(door, cx + 1.2, 1.9, cz - 3.7);
  for (const y of [0.9, 2.9]) {
    put(new THREE.Mesh(scaleUV(new THREE.BoxGeometry(3.4, 0.16, 0.05), 3, 1), mats.metalRusted), cx + 1.2, y, cz - 3.58);
  }
  put(new THREE.Mesh(scaleUV(new THREE.BoxGeometry(0.3, 0.3, 0.1), 1, 1), mats.metalRusted), cx + 1.2, 1.9, cz - 3.55);
  const trim = new THREE.Mesh(scaleUV(new THREE.BoxGeometry(12.3, 0.3, 0.6), 6, 1), mats.woodWeathered); put(trim, cx, 6.0, cz - 4);
  for (let i = 0; i < 3; i++) put(new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.8), mats.hay), cx - 4 + i * 1.3 + (i == 2 ? 0.6 : 0), 0.4 + (i == 2 ? 0.8 : 0), cz - 2.9);
  put(new THREE.Mesh(scaleUV(new THREE.CylinderGeometry(0.03, 0.03, 3.5, 8), 1, 8), mats.rope), cx + 4.6, 3.6, cz - 3.5);
  for (const dx of [-5.2, 5.5]) { const b = put(new THREE.Mesh(foliageCardGeo, mats.foliage), cx + dx, 0, cz - 2.2); b.scale.setScalar(2.2); b.customDepthMaterial = mats.foliage.userData.depthMaterial; const b2 = b.clone(); b2.rotation.y = 1.3; scene.add(b2); }
  put(new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.9, 20), mats.metalRusted), cx - 2.0, 0.45, cz - 1.5);
  addGrassStrip(cx - 8, cz + 2, 5, 16);
}

// ---------------- station: headlight ----------------
let hl;
{
  const cx = 300, cz = 0;
  const body = new THREE.Group();
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.4, 2.6), mats.makePaint(0xa82a1c)); chassis.position.y = 0.55; chassis.castShadow = true; body.add(chassis);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.5, 1.0), mats.woodWeathered); cab.position.set(0, 0.95, 0.4); cab.castShadow = true; body.add(cab);
  for (const [x, z] of [[-0.8, -0.9], [0.8, -0.9], [-0.8, 0.9], [0.8, 0.9]]) {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.25, 20).rotateZ(Math.PI / 2), mats.rubber); w.position.set(x, 0.34, z); w.castShadow = true; body.add(w);
  }
  const lamp = new THREE.Object3D(); lamp.position.set(0, 0.65, -1.32); body.add(lamp);
  const lampMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.14, 16).rotateX(Math.PI / 2), mats.metalRusted); lampMesh.position.copy(lamp.position).add(new THREE.Vector3(0, 0, 0.05)); body.add(lampMesh);
  body.position.set(cx, 0, cz); scene.add(body);
  hl = attachHeadlight(lamp);
  window.__coat = mats.applyMudCoat(body); window.__coat.set(+(q.get('coat') || 0));
  const wall = new THREE.Mesh(scaleUV(new THREE.BoxGeometry(12, 6, 0.4), 6, 3), mats.barnPaint); put(wall, cx + 2, 3, cz - 26);
  for (const [dx, dz] of [[-2.5, -8], [3, -12], [-3.5, -17], [2.2, -21]]) {
    put(new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 2.4, 10), mats.woodWeathered), cx + dx, 1.2, cz + dz);
  }
  for (const [dx, dz, s] of [[1.2, -6, 0.5], [-1.4, -10, 0.8], [0.6, -15, 0.7], [-0.5, -19, 0.9]]) put(new THREE.Mesh(new THREE.DodecahedronGeometry(s, 1), mats.rock), cx + dx, s * 0.4, cz + dz);
  const fol = put(new THREE.Mesh(foliageCardGeo, mats.foliage), cx - 3, 0, cz - 5); fol.scale.setScalar(2.2); fol.customDepthMaterial = mats.foliage.userData.depthMaterial;
  const water = new THREE.Mesh(mats.makePuddleGeometry(2.0, 1.4, 7), mats.waterPuddle); water.position.set(cx + 0.3, 0.025, cz - 7.5); water.renderOrder = 2; scene.add(water);
  addGrassStrip(cx - 8, cz - 10, 6, 40);
}

// ---------------- station: hazards (scene-style decals: UV = metres/2.4) ----------------
{
  const cx = 400, cz = 0;
  const road = new THREE.Mesh(scaleUV(new THREE.PlaneGeometry(7, 60).rotateX(-Math.PI / 2), 7 / 2.4, 60 / 2.4), mats.dirtRoad);
  road.position.set(cx, 0.004, cz - 20); road.receiveShadow = true; scene.add(road);
  const decal = (mat, x0, x1, z0, z1, y) => {
    const g = new THREE.PlaneGeometry(x1 - x0, z1 - z0, 20, 24).rotateX(-Math.PI / 2);
    const uv = g.attributes.uv, p = g.attributes.position, col = new Float32Array(p.count * 4);
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i) + (x0 + x1) / 2, z = p.getZ(i) + (z0 + z1) / 2;
      uv.setXY(i, x / 2.4, z / 2.4);
      const ex = Math.min(x - x0, x1 - x) / 1.2, ez = Math.min(z - z0, z1 - z) / 3;
      const a = Math.max(0, Math.min(1, Math.min(ex, ez)));
      col.set([1, 1, 1, a * a * (3 - 2 * a)], i * 4);
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 4));
    const m = new THREE.Mesh(g, mat); m.position.set(cx + (x0 + x1) / 2 - (x0 + x1) / 2, y, (z0 + z1) / 2 + cz); m.receiveShadow = true; m.renderOrder = 1; scene.add(m); return m;
  };
  const dec = (base, o) => { const m = base.clone(); m.onBeforeCompile = base.onBeforeCompile; m.vertexColors = true; m.transparent = true; m.depthWrite = false; m.polygonOffset = true; m.polygonOffsetFactor = o; m.polygonOffsetUnits = o; return m; };
  const mudM = dec(mats.mud, -2), gravM = dec(mats.gravel, -2), watM = dec(mats.water, -4);
  decal(mudM, cx - 3, cx + 3, -12, -2, 0.02);
  decal(gravM, cx - 3, cx + 3, -30, -16, 0.015);
  decal(watM, cx - 2.5, cx + 2.5, -50, -42, 0.03);
  for (const [dx, dz] of [[-3.8, -8], [3.9, -20], [-3.9, -34], [3.8, -46]]) put(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 1.4, 8), mats.woodWeathered), cx + dx, 0.7, cz + dz);
  addGrassStrip(cx - 7, cz - 20, 7, 70); addGrassStrip(cx + 7, cz - 20, 7, 70);
  put(new THREE.Mesh(scaleUV(new THREE.BoxGeometry(12, 5, 0.4), 6, 2.5), mats.barnPaint), cx + 6, 2.5, cz - 56);
}

// ---------------- camera rigs ----------------
const rigs = {
  materialsA: { p: [0, 3.6, 11.5], t: [0, 0.5, 0.8], fov: 46 },
  materialsB: { p: [60, 3.6, 11.5], t: [60, 0.5, 0.8], fov: 46 },
  puddle: { p: [120, 1.25, 6.5], t: [120, 0.5, -1.8], fov: 55 },
  barn: { p: [182, 1.6, 5.6], t: [181, 2.4, -3.0], fov: 55 },
  headlight: { p: [301.6, 1.3, 3.4], t: [300, 0.6, -10], fov: 58 },
  hazMud: { p: [400, 1.35, -0.5], t: [400, 0.2, -7], fov: 62 },
  hazGravel: { p: [400, 1.35, -13], t: [400, 0.2, -21], fov: 62 },
  hazWater: { p: [400, 1.35, -38], t: [400, 0.2, -45], fov: 62 },
  coat: { p: [302.6, 1.0, 3.2], t: [300, 0.5, 0], fov: 55 },
  beam: { p: [304.8, 1.5, -2.5], t: [300, 0.7, -9], fov: 60 },
  post: { p: [182, 1.6, 5.0], t: [181, 2.2, -3.0], fov: 62 },
};
const rig = rigs[shot];
camera.position.set(...rig.p); camera.lookAt(...rig.t); camera.fov = rig.fov; camera.updateProjectionMatrix();
if (shot === 'headlight' || shot === 'beam' || q.get('headlight') === '1') hl.setOn(true);
if (shot === 'hazWater') post.setPlanarReflection({ y: 0.03, materials: mats.waterMaterials });
if (shot === 'puddle' && q.get('refl') !== '0') post.setPlanarReflection({ y: 0.03, materials: mats.waterMaterials });
if (shot === 'headlight') post.setPlanarReflection({ y: 0.025, materials: mats.waterMaterials });
if (shot === 'post') {
  post.addSplatter('mud', 0.9); post.addSplatter('water', 0.9); post.addSplatter('mud', 0.4);
  // age the drops a touch so some water trails exist
}
document.getElementById('info').textContent = `${shot} / ${time}  mats ${matMs.toFixed(0)}ms`;
if (!shot.startsWith('materials')) labels.forEach((l) => (l.el.style.display = 'none'));
if (q.get('labels') === '0') labels.forEach((l) => (l.el.style.display = 'none'));

let frame = 0;
const v = new THREE.Vector3();
function tick() {
  frame++;
  light.update(1 / 30, camera);
  if (shot === 'headlight' || shot === 'beam') hl.update(1 / 30);
  post.render(1 / 30, { speed: shot === 'post' ? 22 : shot === 'headlight' ? 24 : 0 });
  for (const l of labels) {
    v.copy(l.pos).project(camera);
    l.el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px'; l.el.style.top = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px';
  }
  if (frame === 6) window.__ready = true;
  if (frame >= +(q.get('stopAt') || 8) && window.__ready && q.get('stop') !== '0') { window.__stopped = true; return; }
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
